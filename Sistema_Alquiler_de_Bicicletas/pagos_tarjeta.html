<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagos y multas - RentaBici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="encabezado">
    <!-- Ícono de persona: vuelve a Pagos y multas -->
    <a class="encabezado__volver" href="pagos.html" aria-label="Volver a Pagos y multas" title="Volver">
      <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="18" cy="11" r="6.5"/>
        <path d="M4.5 33c0-7.5 6-12.5 13.5-12.5S31.5 25.5 31.5 33"/>
      </svg>
    </a>
    <h1 class="encabezado__titulo encabezado__titulo--largo">Pagos y multas</h1>
  </header>

  <main class="formulario-pagina">
    <form id="formulario-pago" class="formulario formulario--estrecho formulario--alquiler" novalidate>

      <div class="campo">
        <label for="tarjeta">Numero tarjeta</label>
        <input class="entrada" type="text" id="tarjeta" placeholder="0000" inputmode="numeric" autocomplete="off">
      </div>

      <div class="campo">
        <label for="vencimiento">Fecha</label>
        <input class="entrada" type="text" id="vencimiento" placeholder="00/00" inputmode="numeric" maxlength="5" autocomplete="off">
      </div>

      <div class="campo">
        <label for="codigo">Codigo</label>
        <input class="entrada" type="password" id="codigo" placeholder="000" inputmode="numeric" maxlength="4" autocomplete="off">
      </div>

      <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

      <button class="boton boton--auto" id="confirmar" type="submit">Confirmar</button>

    </form>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/avisos.js"></script>
  <script src="js/pagos_tarjeta.js"></script>
</body>
</html>
