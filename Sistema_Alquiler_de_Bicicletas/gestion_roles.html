<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de roles y permisos - RentaBici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="encabezado">
    <!-- Ícono de persona: vuelve al menú del administrador -->
    <a class="encabezado__volver" id="volver" href="menu_administrador.html" aria-label="Volver al menú principal" title="Volver al menú">
      <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="18" cy="11" r="6.5"/>
        <path d="M4.5 33c0-7.5 6-12.5 13.5-12.5S31.5 25.5 31.5 33"/>
      </svg>
    </a>

    <h1 class="encabezado__titulo encabezado__titulo--largo">Gestión de roles y permisos</h1>

    <!-- Ícono de guardar: guarda los cambios sin salir de la página -->
    <button class="encabezado__guardar" id="guardar" type="button" aria-label="Guardar cambios" title="Guardar cambios">
      <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 5h20l5 5v21a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>
        <path d="M11 5v8h13V5"/>
        <rect x="10" y="20" width="16" height="12" rx="1"/>
      </svg>
    </button>
  </header>

  <main class="roles-pagina">
    <div class="tabla-contenedor">
      <table class="tabla-roles">
        <thead>
          <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Correo</th>
            <th scope="col">Rol</th>
          </tr>
        </thead>
        <!-- Las filas se generan en js/gestion_roles.js -->
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/avisos.js"></script>
  <script src="js/gestion_roles.js"></script>
</body>
</html>
