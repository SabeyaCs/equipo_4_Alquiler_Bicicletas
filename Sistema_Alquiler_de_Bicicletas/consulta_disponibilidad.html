<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Disponibilidad - RentaBici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="encabezado">
    <a class="encabezado__volver" id="volver" href="menu_usuario.html" aria-label="Volver al menú principal" title="Volver al menú">
      <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="18" cy="11" r="6.5"/>
        <path d="M4.5 33c0-7.5 6-12.5 13.5-12.5S31.5 25.5 31.5 33"/>
      </svg>
    </a>
    <h1 class="encabezado__titulo encabezado__titulo--largo">Consulta Disponibilidad</h1>
  </header>

  <main class="estaciones-pagina">
    <div class="tabla-contenedor">
      <table class="tabla-estaciones">
        <thead>
          <tr>
            <th scope="col">Estación</th>
            <th scope="col">Modelo</th>
            <th scope="col">Cantidad</th>
          </tr>
        </thead>
        <!-- Las filas se generan en js/consulta_disponibilidad.js -->
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>

    <div class="acciones-fila acciones-fila--izquierda">
      <a class="boton" href="mapa_estaciones.html">Mapa Estaciones</a>
    </div>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/consulta_disponibilidad.js"></script>
</body>
</html>
