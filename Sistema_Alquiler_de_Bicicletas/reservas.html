<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar Reserva - RentaBici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="encabezado">
    <a class="encabezado__volver" id="volver" href="menu_usuario.html" aria-label="Volver al menú principal" title="Volver">
      <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="18" cy="11" r="6.5"/>
        <path d="M4.5 33c0-7.5 6-12.5 13.5-12.5S31.5 25.5 31.5 33"/>
      </svg>
    </a>
    <h1 class="encabezado__titulo encabezado__titulo--largo">Administrar Reserva</h1>
  </header>

  <main class="reserva-pagina">
    <div class="reserva-datos">
      <div class="campo">
        <label for="id-bicicleta">Id bicicleta</label>
        <input class="entrada" type="text" id="id-bicicleta" readonly placeholder="00001">
      </div>

      <div class="campo">
        <label for="estado">Estado</label>
        <input class="entrada" type="text" id="estado" readonly placeholder="En estacion">
      </div>

      <div class="campo reserva-datos__tiempo">
        <label for="tiempo">Tiempo</label>
        <input class="entrada" type="text" id="tiempo" readonly placeholder="Tiempo">
      </div>
    </div>

    <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

    <div class="acciones-fila reserva-acciones">
      <button class="boton" id="recibir" type="button">Recibir</button>
      <button class="boton" id="entregar" type="button">Entregar</button>
      <button class="boton" id="cancelar" type="button">Cancelar</button>
    </div>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/avisos.js"></script>
  <script src="js/reservas.js"></script>
</body>
</html>
